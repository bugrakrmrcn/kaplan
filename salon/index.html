<title>Muscles4Chicks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mr+Dafoe&family=Syncopate:wght@400;700&family=Outfit:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Düzen: telefon öncelikli tek sütun. Arkada Ocean Drive gecesi (Art Deco silüet, gün batımı, palmiye, ızgara deniz);
   önde çift çizgili Art Deco çerçeveli cam kartlar. Tek tema: bilerek gece. */
:root {
  --night: #07061a;          /* gece laciverti */
  --navy: #0f0c2e;
  --glass: rgba(16, 12, 44, .78);
  --glass-hi: rgba(30, 22, 78, .85);
  --pink: #ff5fae;           /* neon pembe */
  --teal: #3ff0d8;           /* Miami turkuazı */
  --peach: #ffb38a;          /* pastel şeftali */
  --lilac: #b9a6ff;
  --cream: #fff5ec;          /* keten beyazı */
  --muted: #a89fd0;
  --line: rgba(185, 166, 255, .18);
  --gold: #ffd98a; --silver: #dfe7ff; --bronze: #ffad85;
  --chrome: linear-gradient(180deg, #ffffff 0%, #e8edff 38%, #8d97d6 50%, #f4f6ff 58%, #ffffff 100%);
  --f-script: "Mr Dafoe", "Brush Script MT", cursive;
  --f-wide: "Syncopate", "Michroma", "Arial Black", system-ui, sans-serif;
  --f-body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Saira Condensed", "Outfit", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--night); color: var(--cream); font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(100px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%; overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

/* =============== sahne */
.scene { position: fixed; inset: 0; z-index: -1; overflow: hidden;
  background: linear-gradient(180deg, #07061a 0%, #140f3d 28%, #3a1a6e 46%, #9b2f86 58%, #ff6f9e 66%, #ffb38a 71%, #0a0820 71.2%, #07061a 100%); }
.scene .sun { position: absolute; left: 50%; top: 63%; width: min(78vw, 460px); aspect-ratio: 1; transform: translate(-50%, -54%); border-radius: 50%;
  background: linear-gradient(180deg, #ffe5a3 0%, #ffb38a 35%, #ff5fae 75%, #c23a9c 100%);
  -webkit-mask: linear-gradient(180deg, #000 52%, transparent 52.5%, #000 56%, transparent 57.5%, #000 61%, transparent 63%, #000 66.5%, transparent 69%, #000 72.5%, transparent 75.5%, #000 79%, transparent 83%);
          mask: linear-gradient(180deg, #000 52%, transparent 52.5%, #000 56%, transparent 57.5%, #000 61%, transparent 63%, #000 66.5%, transparent 69%, #000 72.5%, transparent 75.5%, #000 79%, transparent 83%);
  box-shadow: 0 0 120px rgba(255, 95, 174, .45); opacity: .9; }
.scene .city { position: absolute; left: 0; right: 0; bottom: 29%; width: 100%; height: auto; max-height: 34vh; }
.scene .sea { position: absolute; left: -50%; right: -50%; top: 71%; bottom: -30%; transform: perspective(260px) rotateX(64deg); transform-origin: top;
  background:
    linear-gradient(transparent 0 calc(100% - 1.5px), rgba(63, 240, 216, .55) 0) 0 0 / 100% 46px,
    linear-gradient(90deg, transparent 0 calc(100% - 1.5px), rgba(255, 95, 174, .4) 0) 0 0 / 70px 100%;
  animation: drive 4s linear infinite; }
@keyframes drive { to { background-position: 0 46px, 0 0; } }
.scene .reflect { position: absolute; left: 50%; top: 71%; width: min(70vw, 420px); height: 12%; transform: translateX(-50%);
  background: repeating-linear-gradient(180deg, rgba(255, 179, 138, .55) 0 3px, transparent 3px 9px); filter: blur(1px);
  -webkit-mask: radial-gradient(closest-side, #000, transparent); mask: radial-gradient(closest-side, #000, transparent); }
.scene .palm { position: absolute; bottom: 26%; fill: #050414; }
.scene .palm.l { left: -10vw; width: 50vw; max-width: 320px; }
.scene .palm.r { right: -12vw; width: 42vw; max-width: 280px; transform: scaleX(-1); }
.scene::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px); }   /* VHS tarama */
.scene::after { content: ""; position: absolute; inset: 0; z-index: 3;
  background: radial-gradient(120% 80% at 50% 40%, transparent 40%, rgba(7, 6, 26, .85) 100%), linear-gradient(180deg, rgba(7, 6, 26, .6), rgba(7, 6, 26, .1) 35%, rgba(7, 6, 26, .7) 80%); }

.app { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }

/* =============== logo */
.logo { position: relative; display: inline-grid; justify-items: start; line-height: 1; }
.logo .l1 { font-family: var(--f-script); font-size: 52px; color: var(--pink); transform: rotate(-6deg); margin-left: -2px;
  text-shadow: 0 0 2px #fff, 0 0 10px var(--pink), 0 0 28px rgba(255, 95, 174, .8), 0 0 60px rgba(255, 95, 174, .45); }
.logo .l2 { font-family: var(--f-wide); font-weight: 700; font-size: 20px; letter-spacing: 3px; margin: -6px 0 0 34px;
  background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #2a1f6b) drop-shadow(0 0 10px rgba(63, 240, 216, .35)); }
.logo .l2 b { color: var(--teal); -webkit-text-fill-color: var(--teal); font-weight: 700; margin-right: 2px; text-shadow: 0 0 12px var(--teal); }
.logo .tag { margin: 8px 0 0 34px; font-family: var(--f-wide); font-size: 8.5px; letter-spacing: 3.5px; color: var(--muted); white-space: nowrap; }
.logo.big { justify-items: center; }
.logo.big .l1 { font-size: clamp(66px, 22vw, 96px); }
.logo.big .l2 { font-size: clamp(24px, 7.4vw, 34px); letter-spacing: 5px; margin: -10px 0 0 0; }
.logo.big .tag { margin: 12px 0 0; font-size: 10px; letter-spacing: 5px; }

header { display: flex; align-items: flex-start; gap: 12px; padding-top: 6px; }
.me-chip { margin-left: auto; flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--line); font-family: var(--f-wide); font-size: 10px; letter-spacing: 1.5px; backdrop-filter: blur(10px); }

/* =============== avatar */
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-wide); font-size: 13px; color: var(--night); flex: none; }
.av.k { background: conic-gradient(from 200deg, var(--teal), #7cf7ff, var(--teal)); }
.av.b { background: conic-gradient(from 200deg, var(--pink), #ffb3dc, var(--pink)); }
.av.a { background: conic-gradient(from 200deg, var(--peach), #ffe2a8, var(--peach)); }
.av.lg { width: 70px; height: 70px; font-size: 24px; }
.av:has(img) { padding: 2px; box-shadow: 0 0 14px rgba(255, 95, 174, .25); }
.av.k:has(img) { box-shadow: 0 0 14px rgba(63, 240, 216, .35); }
.av.a:has(img) { box-shadow: 0 0 14px rgba(255, 179, 138, .35); }
.av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--night); }

/* =============== Art Deco cam kart */
.card { position: relative; background: var(--glass); border: 1px solid rgba(63, 240, 216, .28); border-radius: 20px; padding: 18px 16px 16px;
  display: grid; gap: 14px; min-width: 0; backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: inset 0 0 0 4px rgba(7, 6, 26, .55), inset 0 0 0 5px rgba(255, 95, 174, .22), 0 24px 60px rgba(0, 0, 0, .5); }
.card::before { content: ""; position: absolute; left: 50%; top: -1px; width: 64px; height: 4px; transform: translateX(-50%);
  background: linear-gradient(90deg, var(--pink) 0 30%, transparent 30% 35%, var(--teal) 35% 65%, transparent 65% 70%, var(--peach) 70%); border-radius: 0 0 3px 3px; }
.label { display: flex; align-items: center; gap: 10px; font-family: var(--f-wide); font-size: 10px; font-weight: 700; letter-spacing: 3px; color: var(--teal); text-transform: uppercase; }
.label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(63, 240, 216, .5), transparent); }
h2 { font-family: var(--f-wide); font-weight: 700; font-size: 16px; letter-spacing: 2px; margin: 0; }
.muted { color: var(--muted); }

/* =============== giriş */
.login { display: grid; gap: 18px; padding-top: 5vh; justify-items: center; }
.login .hl { font-family: var(--f-wide); font-size: 12px; letter-spacing: 4px; color: var(--cream); margin: 4px 0 0; text-align: center; }
.login p { margin: -10px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
.who { display: grid; gap: 12px; width: 100%; }
.who button { position: relative; display: flex; align-items: center; gap: 16px; padding: 12px 18px 12px 12px; border-radius: 22px; text-align: left; width: 100%;
  background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); overflow: hidden;
  box-shadow: inset 0 0 0 4px rgba(7, 6, 26, .5), inset 0 0 0 5px rgba(185, 166, 255, .12); transition: transform .15s, box-shadow .25s, border-color .25s; }
.who button::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent, var(--pink)); box-shadow: 0 0 16px var(--accent, var(--pink)); }
.who button:hover, .who button:active { transform: translateY(-2px); border-color: var(--accent, var(--pink));
  box-shadow: inset 0 0 0 4px rgba(7, 6, 26, .5), inset 0 0 0 5px var(--accent, var(--pink)), 0 0 30px rgba(255, 95, 174, .25); }
.who .nm { font-family: var(--f-wide); font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
.me-chip, .pod .nm { text-transform: uppercase; }
.who .st { color: var(--muted); font-size: 13px; }
.who .go { margin-left: auto; font-family: var(--f-wide); color: var(--accent, var(--pink)); font-size: 18px; }

/* =============== hareket seçimi */
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ex { padding: 11px 12px; border-radius: 12px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); font-weight: 600; text-align: left;
  font-size: 15px; line-height: 1.15; min-height: 48px; transition: border-color .2s, background .2s; }
.ex.on { background: linear-gradient(135deg, rgba(255, 95, 174, .28), rgba(63, 240, 216, .14)); border-color: var(--pink);
  box-shadow: 0 0 0 1px var(--pink), 0 0 18px rgba(255, 95, 174, .35); }
.ex.add { color: var(--teal); border-style: dashed; border-color: rgba(63, 240, 216, .45); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; }
input[type=text], input[type=number], select { background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 16px; width: 100%; color: var(--cream); }
select { font-weight: 600; }

/* =============== ağırlık */
.weight { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.wnum { display: flex; align-items: baseline; justify-content: center; gap: 6px; min-width: 0; }
.wnum input { font-family: var(--f-num); font-weight: 800; font-size: 72px; line-height: 1; text-align: center; width: 100%; max-width: 220px; padding: 0; border: 0; background: none;
  color: var(--cream); text-shadow: 0 0 2px #fff, 0 0 20px rgba(255, 95, 174, .7), 0 0 44px rgba(255, 95, 174, .35); font-variant-numeric: tabular-nums; }
.wnum span { font-family: var(--f-wide); font-weight: 700; color: var(--pink); font-size: 13px; letter-spacing: 2px; }
.steps { display: grid; gap: 6px; }
.st-btn { width: 62px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line);
  font-family: var(--f-num); font-weight: 700; font-size: 20px; transition: background .15s, border-color .15s; }
.st-btn:active { background: rgba(255, 95, 174, .25); border-color: var(--pink); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { display: grid; gap: 6px; background: rgba(0, 0, 0, .28); border: 1px solid rgba(185, 166, 255, .1); border-radius: 16px; padding: 10px; }
.mini .label { font-size: 9px; }
.mini .row { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
.mini .row b { text-align: center; font-family: var(--f-num); font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mini button { height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .06); font-size: 22px; font-weight: 600; }
.hint { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.hint b { color: var(--cream); }
.save { position: relative; height: 64px; border-radius: 16px; font-family: var(--f-wide); font-weight: 700; font-size: 17px; letter-spacing: 6px; color: var(--night); overflow: hidden;
  background: linear-gradient(90deg, var(--pink), #ff8fb8 45%, var(--peach)); box-shadow: 0 0 0 1px rgba(255, 255, 255, .4) inset, 0 10px 34px rgba(255, 95, 174, .5); transition: transform .1s, filter .2s; }
.save::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .45) 45%, transparent 60%); transform: translateX(-100%); animation: shine 3.5s ease-in-out infinite; }
@keyframes shine { 60%, 100% { transform: translateX(100%); } }
.save:active { transform: scale(.98); filter: brightness(1.08); }
.save[disabled] { opacity: .5; }

/* =============== sıralama */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: rgba(0, 0, 0, .32); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { padding: 10px 6px; border-radius: 10px; font-family: var(--f-wide); font-weight: 700; font-size: 9.5px; letter-spacing: 1.5px; color: var(--muted); }
.seg button.on { background: linear-gradient(135deg, rgba(63, 240, 216, .22), rgba(255, 95, 174, .18)); color: var(--cream); box-shadow: inset 0 0 0 1px var(--teal); }
.podium { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 8px; padding-top: 10px; }
.pod { display: grid; justify-items: center; gap: 6px; text-align: center; min-width: 0; }
.pod .nm { font-family: var(--f-wide); font-weight: 700; font-size: 10.5px; letter-spacing: 1.5px; }
.pod .val { font-family: var(--f-num); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.pod .val small { font-size: 13px; color: var(--muted); font-weight: 600; }
.pod .sub { font-size: 12px; color: var(--muted); }
/* Art Deco sütunlar: basamaklı tepe ve dikey yivler */
.block { position: relative; width: 100%; display: grid; place-items: start center; padding-top: 14px; font-family: var(--f-wide); font-weight: 700; font-size: 20px; color: var(--night);
  clip-path: polygon(0 14px, 14% 14px, 14% 6px, 30% 6px, 30% 0, 70% 0, 70% 6px, 86% 6px, 86% 14px, 100% 14px, 100% 100%, 0 100%);
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .22) 0 2px, transparent 2px 14px), var(--pc); }
.p1 .block { height: 118px; --pc: linear-gradient(180deg, var(--gold), #f3a54a); filter: drop-shadow(0 0 18px rgba(255, 217, 138, .45)); }
.p2 .block { height: 90px; --pc: linear-gradient(180deg, var(--silver), #8f9ad8); }
.p3 .block { height: 68px; --pc: linear-gradient(180deg, var(--bronze), #d0617a); }
.pod.empty .block { --pc: rgba(255, 255, 255, .07); color: var(--muted); filter: none; }
.rank-list { display: grid; gap: 6px; }
.rrow { display: grid; grid-template-columns: 22px 36px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; background: rgba(0, 0, 0, .26); border: 1px solid rgba(185, 166, 255, .08); }
.rrow .pos { font-family: var(--f-wide); font-weight: 700; color: var(--peach); }
.rrow .v { font-family: var(--f-num); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; }
.bar .track { height: 32px; border-radius: 10px; background: rgba(0, 0, 0, .3); position: relative; overflow: hidden; border: 1px solid rgba(185, 166, 255, .08); }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 10px; }
.bar .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13px; font-weight: 700; }

/* =============== geçmiş */
.day { font-family: var(--f-wide); font-weight: 700; font-size: 9.5px; letter-spacing: 3px; color: var(--peach); margin-top: 6px; }
.feed { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: rgba(0, 0, 0, .26);
  border: 1px solid rgba(185, 166, 255, .08); min-width: 0; }
.item .t { min-width: 0; }
.item .t b { font-weight: 700; }
.item .t div { font-size: 13px; color: var(--muted); }
.item .kg { font-family: var(--f-num); font-weight: 800; font-size: 24px; text-align: right; font-variant-numeric: tabular-nums; }
.pr { display: inline-block; font-family: var(--f-wide); font-size: 8.5px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 7px; border-radius: 999px;
  background: linear-gradient(90deg, var(--pink), var(--peach)); color: var(--night); margin-left: 6px; vertical-align: 2px; }
.del { font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); margin-top: 4px; }
.del.sure { color: var(--night); background: var(--pink); border-color: var(--pink); }
.spark { width: 100%; height: auto; display: block; }
.empty { text-align: center; padding: 22px 10px; color: var(--muted); display: grid; gap: 6px; }
.empty b { color: var(--cream); font-family: var(--f-wide); font-weight: 700; font-size: 12px; letter-spacing: 2px; }
.note { font-size: 13px; color: var(--peach); text-align: center; }

/* =============== alt menü */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, rgba(7, 6, 26, 0), rgba(7, 6, 26, .96) 35%); }
nav.tabs .in { max-width: 560px; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: rgba(16, 12, 44, .94);
  border: 1px solid rgba(63, 240, 216, .25); border-radius: 22px; padding: 6px; backdrop-filter: blur(14px);
  box-shadow: inset 0 0 0 3px rgba(7, 6, 26, .6), inset 0 0 0 4px rgba(255, 95, 174, .18), 0 -6px 30px rgba(0, 0, 0, .4); }
nav.tabs button { position: relative; padding: 9px 4px 10px; border-radius: 16px; font-family: var(--f-wide); font-weight: 700; font-size: 8.5px; letter-spacing: 1.8px; color: var(--muted);
  display: grid; justify-items: center; gap: 5px; text-transform: uppercase; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.on { color: var(--cream); background: linear-gradient(135deg, rgba(255, 95, 174, .3), rgba(63, 240, 216, .16)); }
nav.tabs button.on::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: 3px; height: 2px; border-radius: 2px; background: var(--pink); box-shadow: 0 0 10px var(--pink); }

/* =============== kutlama */
.toast { position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; padding: 12px 20px; border-radius: 14px;
  background: var(--glass-hi); border: 1px solid var(--teal); box-shadow: 0 0 24px rgba(63, 240, 216, .35); font-weight: 600; text-align: center; max-width: calc(100vw - 32px);
  backdrop-filter: blur(12px); animation: pop .25s ease-out; }
.celebrate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; pointer-events: none; }
.celebrate div { font-family: var(--f-wide); font-weight: 700; font-size: clamp(26px, 8.5vw, 48px); letter-spacing: 3px; text-align: center; line-height: 1.15; padding: 0 16px;
  background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #2a1f6b) drop-shadow(0 0 20px rgba(255, 95, 174, .9)); animation: zoom 1.9s ease-out forwards; }
@keyframes zoom { 0% { transform: scale(.4) rotate(-4deg); opacity: 0; } 15% { transform: scale(1.1) rotate(-4deg); opacity: 1; } 75% { opacity: 1; } 100% { transform: scale(1) rotate(-4deg); opacity: 0; } }
@keyframes pop { from { transform: translate(-50%, -12px); opacity: 0; } }
canvas#fx { position: fixed; inset: 0; z-index: 29; pointer-events: none; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .scene .sea, .save::after { animation: none; } .celebrate div, .toast { animation-duration: .01s; } }
@media (max-width: 380px) { .logo .l1 { font-size: 44px; } .logo .l2 { font-size: 17px; } .logo .tag { display: none; } .st-btn { width: 54px; } }
</style>

const person = (id) => PEOPLE.find((p) => p.id === id) || { id, cls: "k" };
const av = (id, cls = "") => {
  const p = person(id);
  return p.img ? `<span class="av ${p.cls} ${cls}"><img src="${p.img}" alt="${esc(id)}"></span>` : `<span class="av ${p.cls} ${cls}">${esc(String(id).slice(0, 1))}</span>`;
};
const exList = () => [...BASE_EX, ...customEx.filter((x) => !BASE_EX.includes(x))];
const e1rm = (kg, reps) => reps <= 1 ? kg : kg * (1 + reps / 30);    // Epley
const score = (l, mode) => mode === "1rm" ? e1rm(l.kg, l.reps) : l.kg + l.reps / 1000;   // eşit kg'de tekrar sayısı öne geçirir

// ======================================================================= hesaplar
function bestOf(who, ex, mode = "kg", list = lifts) {
  let best = null;
  for (const l of list) if (l.who === who && l.ex === ex && (!best || score(l, mode) > score(best, mode))) best = l;
  return best;
}
function ranking(ex, mode) {
  return PEOPLE.map((p) => ({ who: p.id, best: bestOf(p.id, ex, mode) }))
    .sort((a, b) => (b.best ? score(b.best, mode) : -1) - (a.best ? score(a.best, mode) : -1));
}
function big3() {
  return PEOPLE.map((p) => {
    const parts = BIG3.map((ex) => bestOf(p.id, ex, "1rm"));
    return { who: p.id, total: parts.reduce((a, l) => a + (l ? e1rm(l.kg, l.reps) : 0), 0), done: parts.filter(Boolean).length };
  }).sort((a, b) => b.total - a.total);
}
function weekStart() { const d = new Date(); const day = (d.getDay() + 6) % 7; d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - day); return d.getTime(); }
function thisWeek() {
  const ws = weekStart();
  return PEOPLE.map((p) => {
    const mine = lifts.filter((l) => l.who === p.id && l.at >= ws);
    return { who: p.id, days: new Set(mine.map((l) => new Date(l.at).toDateString())).size, vol: mine.reduce((a, l) => a + l.kg * l.reps * (l.sets || 1), 0) };
  });
}
function isPR(l) {   // o kaydın anında kişisel rekor olup olmadığı
  return !lifts.some((o) => o !== l && o.who === l.who && o.ex === l.ex && o.at < l.at && o.kg >= l.kg);
}

  const r = ranking(rankEx, rankMode);
  const val = (l) => rankMode === "1rm" ? fmt(e1rm(l.kg, l.reps)) : fmt(l.kg);
  const order = [r[1], r[0], r[2]];
  const cls = ["p2", "p1", "p3"], place = [2, 1, 3];
  const pods = order.map((x, i) => `<div class="pod ${cls[i]} ${x.best ? "" : "empty"}">${av(x.who, i === 1 ? "lg" : "")}<div class="nm">${esc(x.who)}</div>
      <div class="val">${x.best ? val(x.best) : "—"}<small> kg</small></div><div class="sub">${x.best ? `${fmt(x.best.kg)} × ${x.best.reps}` : "kayıt yok"}</div>
      <div class="block">${place[i]}</div></div>`).join("");
  const b3 = big3(), max3 = Math.max(1, ...b3.map((x) => x.total));
  const wk = thisWeek(), maxv = Math.max(1, ...wk.map((x) => x.vol));

  const anyB3 = b3.some((x) => x.total > 0);
  return `<section class="card">
      <div class="label">Kim daha ağır kaldırıyor?</div>
      <select id="rankEx" aria-label="Hareket seç">${exList().map((x) => `<option${x === rankEx ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
      <div class="seg" role="group" aria-label="Sıralama ölçütü"><button type="button" data-mode="kg" class="${rankMode === "kg" ? "on" : ""}">En ağır kaldırış</button><button type="button" data-mode="1rm" class="${rankMode === "1rm" ? "on" : ""}">Tahmini 1RM</button></div>

        : `<div class="empty"><b>Henüz Big 3 kaydı yok</b>Bench, squat veya deadlift kaydedince burada toplam sıralama çıkar.</div>`}

      <div class="bars">${wk.map((x) => `<div class="bar">${av(x.who)}<div class="track"><div class="fill" style="width:${Math.max(3, x.vol / maxv * 100)}%;background:${col[person(x.who).cls]};opacity:.55"></div>
        <div class="t"><span>${x.days} gün</span><span>${fmt(x.vol / 1000, 1)} ton</span></div></div></div>`).join("")}</div>
      <div class="muted" style="font-size:12px">Toplam yük = kg × tekrar × set, pazartesiden beri.</div>
    </section>`;

function spark(ex) {
  const pts = lifts.filter((l) => l.who === me && l.ex === ex).sort((a, b) => a.at - b.at);
  if (pts.length < 2) return `<div class="empty"><b>${pts.length ? "Bir kayıt daha gerekli" : "Bu harekette kaydın yok"}</b>İki kayıttan sonra gelişim çizgin burada görünür.</div>`;
  const W = 520, H = 160, pl = 36, pr = 14, pt = 14, pb = 24;
  const ys = pts.map((p) => p.kg), lo = Math.floor(Math.min(...ys) * 0.95), hi = Math.ceil(Math.max(...ys) * 1.03);
  const x = (i) => pl + i * (W - pl - pr) / (pts.length - 1), y = (v) => pt + (hi - v) * (H - pt - pb) / (hi - lo || 1);
  const line = pts.map((p, i) => `${x(i)},${y(p.kg)}`).join(" ");
  const area = `${pl},${H - pb} ${line} ${x(pts.length - 1)},${H - pb}`;
  const last = pts[pts.length - 1], first = pts[0];
  const ticks = [lo, Math.round((lo + hi) / 2), hi].map((v) => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.1)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#a89fd0">${v}</text>`).join("");
  const d = (t) => new Date(t).toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ex)} ilerleme grafiği">
      <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff5fae" stop-opacity=".45"/><stop offset="1" stop-color="#ff5fae" stop-opacity="0"/></linearGradient></defs>
      ${ticks}<polygon points="${area}" fill="url(#ga)"/><polyline points="${line}" fill="none" stroke="#ff5fae" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="${x(pts.length - 1)}" cy="${y(last.kg)}" r="6" fill="#3ff0d8" stroke="#07061a" stroke-width="2"/>
      <text x="${pl}" y="${H - 6}" font-size="11" fill="#a89fd0">${d(first.at)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="11" fill="#a89fd0">${d(last.at)}</text>
    </svg><div class="hint"><span>İlk: <b>${fmt(first.kg)} kg</b></span><span>Son: <b>${fmt(last.kg)} kg</b></span><span>Fark: <b>${last.kg - first.kg >= 0 ? "+" : ""}${fmt(last.kg - first.kg)} kg</b></span></div>`;
}

function viewHistory() {
  const myEx = [...new Set(lifts.filter((l) => l.who === me).map((l) => l.ex))];
  if (!histEx || !myEx.includes(histEx)) histEx = myEx[0] || form.ex;
  const items = lifts.slice(0, 120);
  let lastDay = "", feed = "";
  for (const l of items) {
    const dd = new Date(l.at), day = dd.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
    if (day !== lastDay) { feed += `<div class="day">${esc(day.toLocaleUpperCase("tr-TR"))}</div>`; lastDay = day; }
    const mineItem = l.who === me;
    feed += `<div class="item">${av(l.who)}<div class="t"><b>${esc(l.who)}</b> · ${esc(l.ex)}${isPR(l) ? '<span class="pr">PR</span>' : ""}
      <div>${l.reps} tekrar × ${l.sets || 1} set · ${dd.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })}</div></div>
      <div class="kg">${fmt(l.kg)} <span class="muted" style="font-size:13px">kg</span>${mineItem ? `<br><button type="button" class="del ${delAsk === l.id ? "sure" : ""}" data-del="${esc(l.id)}">${delAsk === l.id ? "Emin misin? Sil" : "Sil"}</button>` : ""}</div></div>`;
  }
  return `<section class="card">
      <div class="label">Senin gelişimin</div>
      <select id="histEx" aria-label="Hareket seç">${(myEx.length ? myEx : exList()).map((x) => `<option${x === histEx ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
      ${spark(histEx)}
    </section>
    <section class="card">
      <div class="label">Son kayıtlar</div>
      ${items.length ? `<div class="feed">${feed}</div>` : `<div class="empty"><b>Henüz kayıt yok</b>İlk ağırlığı Kaydet sekmesinden gir; buraya herkesin kayıtları düşer.</div>`}
    </section>`;
}

// ======================================================================= kutlama
function toast(msg) {
  const t = $("#toast");
  t.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.innerHTML = ""), 2400);
}
function celebrate(text) {
  $("#cele").innerHTML = `<div>${esc(text)}</div>`;
  setTimeout(() => ($("#cele").innerHTML = ""), 1900);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#fx"), g = c.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; g.scale(dpr, dpr);
  const cols = ["#ff5fae", "#3ff0d8", "#ffb38a", "#fff5ec", "#b9a6ff"];
  const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 360, s: 5 + Math.random() * 6, c: cols[Math.random() * cols.length | 0] }));
  let n = 0;
  (function tick() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vx * 2; g.save(); g.translate(p.x, p.y); g.rotate(p.r * Math.PI / 180); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); }
    if (++n < 110) requestAnimationFrame(tick); else g.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

// ======================================================================= veri (ortak kayıt)
async function saveLift() {
  const kg = Math.round(Number(form.kg) * 100) / 100;
  if (!Number.isFinite(kg) || kg <= 0) return toast("Ağırlığı 0'dan büyük gir.");
  const prevBest = bestOf(me, form.ex, "kg");
  const prevLead = ranking(form.ex, "kg")[0];
  const rec = { who: me, ex: form.ex, kg, reps: form.reps, sets: form.sets, at: Date.now() };
  const btn = document.querySelector("[data-act=save]");
  if (btn) btn.disabled = true;
  try {
    if (db) await db.collection("lifts").add(rec);
    else { rec.id = "l" + rec.at; lifts.unshift(rec); LS.set("local", lifts); render(); }
    const pr = !prevBest || kg > prevBest.kg;
    const lead = prevLead.who !== me && (!prevLead.best || kg > prevLead.best.kg);
    if (lead) celebrate("LİDER SENSİN!");
    else if (pr) celebrate(prevBest ? "YENİ REKOR!" : "İLK KAYIT!");
    else toast(`${form.ex} ${fmt(kg)} kg kaydedildi`);
  } catch (e) {
    toast(e && e.code === "quota_exceeded" ? "Kayıt alanı doldu; eski kayıtları silmek gerekiyor." : "Kaydedilemedi. Bağlantını kontrol edip tekrar dene.");
  } finally {
    const b = document.querySelector("[data-act=save]");
    if (b) b.disabled = false;
  }
}

async function deleteLift(id) {
  try {
    if (db) await db.doc("lifts/" + id).delete();
    else { lifts = lifts.filter((l) => l.id !== id); LS.set("local", lifts); render(); }
    toast("Kayıt silindi");
  } catch (e) { toast("Silinemedi. Tekrar dene."); }
}

async function addExercise(name) {
  name = name.trim().replace(/\s+/g, " ");
  if (!name) return;
  if (exList().some((x) => x.toLocaleLowerCase("tr-TR") === name.toLocaleLowerCase("tr-TR"))) { form.ex = exList().find((x) => x.toLocaleLowerCase("tr-TR") === name.toLocaleLowerCase("tr-TR")); addingEx = false; render(); return; }
  const next = [...customEx, name];
  try {
    if (db) await db.doc("meta/exercises").set({ list: next });
    else { customEx = next; LS.set("customEx", next); }
    customEx = next; form.ex = name; addingEx = false; LS.set("form", form); render();
  } catch (e) { toast("Hareket eklenemedi."); }
}

async function connect() {
  let timer = setTimeout(() => { if (dbState === "loading") { dbState = "slow"; render(); } }, 10000);
  try { db = window.claude && claude.use ? await claude.use("db") : null; } catch (e) { db = null; }
  if (!db) {
    clearTimeout(timer);
    dbState = "local";
    lifts = LS.get("local", []); customEx = LS.get("customEx", []);
    render();
    return;
  }
  db.collection("lifts").orderBy("at", "desc").limit(1000).onSnapshot((snap) => {
    lifts = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((l) => l.who && l.ex && Number.isFinite(l.kg));
    if (!snap.metadata.fromCache) { clearTimeout(timer); dbState = "live"; }
    else if (dbState === "loading") dbState = "live";
    renderKeepInputs();
  }, () => { clearTimeout(timer); dbState = "error"; render(); });
  db.doc("meta/exercises").onSnapshot((s) => {
    const list = s.exists && Array.isArray(s.data().list) ? s.data().list.filter((x) => typeof x === "string").slice(0, 60) : [];
    customEx = list;
    renderKeepInputs();
  }, () => {});
}

function renderKeepInputs() {
  // biri yazarken ekranı yeniden çizip girdiyi bozma
  const a = document.activeElement;
  if (a && (a.id === "kg" || a.id === "newex")) return;
  render();
}

// ======================================================================= etkileşim
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.login) { me = t.dataset.login; LS.set("me", me); view = "kaydet"; const last = bestOf(me, form.ex); if (last) form.kg = last.kg; render(); return; }
  if (t.dataset.view) { view = t.dataset.view; LS.set("view", view); delAsk = ""; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.ex) {
    form.ex = t.dataset.ex;
    const last = lifts.find((l) => l.who === me && l.ex === form.ex);
    if (last) { form.kg = last.kg; form.reps = last.reps; form.sets = last.sets || form.sets; }
    LS.set("form", form); render(); return;
  }
  if (t.dataset.kg) { form.kg = Math.max(0, Math.round((Number(form.kg) + Number(t.dataset.kg)) * 10) / 10); LS.set("form", form); $("#kg").value = form.kg; render(); return; }
  if (t.dataset.reps) { form.reps = Math.max(1, Math.min(50, form.reps + Number(t.dataset.reps))); LS.set("form", form); render(); return; }
  if (t.dataset.sets) { form.sets = Math.max(1, Math.min(20, form.sets + Number(t.dataset.sets))); LS.set("form", form); render(); return; }
  if (t.dataset.mode) { rankMode = t.dataset.mode; LS.set("rankMode", rankMode); render(); return; }
  if (t.dataset.del) { if (delAsk === t.dataset.del) { delAsk = ""; deleteLift(t.dataset.del); } else { delAsk = t.dataset.del; render(); } return; }
  const act = t.dataset.act;
  if (act === "save") saveLift();
  else if (act === "logout") { me = ""; LS.set("me", ""); render(); }
  else if (act === "add-ex") { addingEx = !addingEx; render(); if (addingEx) setTimeout(() => $("#newex")?.focus(), 30); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "kg") { const v = parseFloat(String(e.target.value).replace(",", ".")); if (Number.isFinite(v)) { form.kg = v; LS.set("form", form); } }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "kg") render();
  if (e.target.id === "rankEx") { rankEx = e.target.value; LS.set("rankEx", rankEx); render(); }
  if (e.target.id === "histEx") { histEx = e.target.value; LS.set("histEx", histEx); render(); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "addex") { e.preventDefault(); addExercise($("#newex").value); }
});

render();
connect();
</script>
